name: Getteal
description: >-
  Getteal (Teal Health) is a women's health company offering an FDA-authorized
  at-home cervical cancer screening kit, the Teal Wand, a self-collection device
  that lets people collect a sample privately at home and mail it to a laboratory
  for Primary HPV testing (the same cobas HPV test used in clinics). The service
  pairs the device with virtual provider consultations, a patient portal for
  results, insurance and HSA/FSA billing, and support for major U.S. health
  plans. Getteal is backed by Felicis and surfaced in the API Evangelist network
  as a portfolio company; it is a consumer digital-health brand with no public
  developer program or API surface at this time.
